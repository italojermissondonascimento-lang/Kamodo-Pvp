
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMODO PVP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>KAMODO PVP</h1>

  <div class="arena">
    <div class="hud">
      <span>JOGADOR</span>
      <span>INIMIGO</span>
    </div>

    <div class="health">
      <div id="playerHealth"></div>
      <div id="enemyHealth"></div>
    </div>

    <div id="player" class="character">
      <img src="personagem1.png" alt="Jogador">
    </div>

    <div id="enemy" class="character">
      <img src="personagem2.png" alt="Inimigo">
    </div>

    <div id="message"></div>
  </div>

  <div class="controls">
    <div>
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <button id="fire">ATIRAR</button>
  </div>

  <button id="restart">REINICIAR PARTIDA</button>

  <a href="https://discord.gg/eqv7axP7G" target="_blank">
    ENTRAR NO DISCORD
  </a>

  <script src="script.js"></script>
</body>
</html>
